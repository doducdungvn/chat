<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraChat - Phòng Chat Bảo Mật E2EE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0c10;
      --bg-card: rgba(21, 23, 30, 0.75);
      --bg-sidebar: rgba(15, 17, 23, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-focus: rgba(139, 92, 246, 0.3);
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-gradient: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      --accent-gradient-hover: linear-gradient(135deg, #a78bfa, #60a5fa);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.25);
      --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --status-online: #10b981;
      --status-offline: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 82, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseOnline {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; font-weight: 600;
      color: white; user-select: none; flex-shrink: 0;
    }
    .av-g1 { background: linear-gradient(135deg, #f6d365, #fda085); }
    .av-g2 { background: linear-gradient(135deg, #abecd6, #fbed96); }
    .av-g3 { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
    .av-g4 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
    .av-g5 { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }

    /* Login & Room Setup UI */
    .welcome-container {
      background: var(--bg-card); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 32px; width: 450px; max-width: 92%;
      box-shadow: var(--shadow-card); backdrop-filter: blur(16px);
      animation: fadeIn 0.5s ease; z-index: 10;
    }
    .welcome-logo { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; }
    .welcome-logo svg { width: 36px; height: 36px; fill: var(--accent-purple); }
    .welcome-logo h1 { font-size: 2rem; background: linear-gradient(to right, #fff, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .tab-buttons { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; }
    .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 8px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { color: white; background: rgba(139, 92, 246, 0.2); }

    .input-group { margin-bottom: 16px; text-align: left; }
    .input-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; display: block; text-transform: uppercase; }
    .input-field { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 10px; padding: 12px 14px; color: white; outline: none; }
    .input-field:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px var(--glass-focus); }

    .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 8px; margin-bottom: 20px; }
    .avatar-grid .avatar { cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .avatar-grid .avatar.selected { border-color: var(--accent-purple); transform: scale(1.1); }

    .btn-submit { width: 100%; background: var(--accent-gradient); border: none; border-radius: 12px; padding: 14px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-submit:hover { background: var(--accent-gradient-hover); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; text-align: center; }

    /* App Chat */
    .chat-app { display: none; width: 1200px; max-width: 95vw; height: 85vh; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--shadow-card); backdrop-filter: blur(16px); grid-template-columns: 300px 1fr; overflow: hidden; }
    .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
    .user-profile { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.02); }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }
    .section-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin: 12px 8px 6px 8px; }
    .list-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: 0.2s; margin-bottom: 4px; }
    .list-item:hover { background: rgba(255, 255, 255, 0.04); }
    .list-item.active { background: rgba(139, 92, 246, 0.15); border-left: 3px solid var(--accent-purple); }

    .chat-window { display: flex; flex-direction: column; height: 100%; position: relative; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(15, 17, 23, 0.3); }
    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    .msg-group { display: flex; gap: 10px; max-width: 75%; animation: fadeIn 0.2s; }
    .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; word-break: break-word; }
    .msg-group.me .msg-bubble { background: var(--accent-gradient); color: white; }
    .msg-group.other .msg-bubble { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border); }

    .system-message { align-self: center; background: rgba(255, 255, 255, 0.04); border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; color: var(--text-muted); margin: 6px 0; }

    .chat-input-area { padding: 16px 20px; border-top: 1px solid var(--glass-border); }
    .input-wrapper { display: flex; gap: 10px; }
    .chat-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 16px; color: white; outline: none; }

    /* Modal / Admin Overlay */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(4px); }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #15171e; border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px; width: 380px; z-index: 101; box-shadow: var(--shadow-card); }
    .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: white; }
    .modal-btn { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
  </style>
</head>
<body>

  <!-- 1. FORM ĐĂNG NHẬP / TẠO PHÒNG -->
  <div class="welcome-container" id="welcomeScreen">
    <div class="welcome-logo">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <h1>AuraChat</h1>
    </div>

    <div class="tab-buttons">
      <button class="tab-btn active" id="tabJoin">Tham Gia Phòng</button>
      <button class="tab-btn" id="tabCreate">Tạo Phòng Mới</button>
    </div>

    <!-- Form Tham Gia -->
    <div id="panelJoin">
      <div class="input-group">
        <label class="input-label">Mã Phòng</label>
        <input type="text" id="joinRoomId" class="input-field" placeholder="Nhập Mã Phòng..." style="text-transform: uppercase;">
      </div>
      <div class="input-group">
        <label class="input-label">Mật khẩu Phòng (Nếu có)</label>
        <input type="password" id="joinRoomPass" class="input-field" placeholder="Mật khẩu mã hóa E2EE">
      </div>
      <div class="input-group">
        <label class="input-label">Biệt danh của bạn</label>
        <input type="text" id="joinNick" class="input-field" placeholder="Nhập biệt danh..." maxlength="20">
      </div>
      <button class="btn-submit" id="btnJoinRoom">Bắt đầu Chat</button>
    </div>

    <!-- Form Tạo Phòng -->
    <div id="panelCreate" style="display: none;">
      <div class="input-group">
        <label class="input-label">Tên Phòng Chat</label>
        <input type="text" id="createRoomName" class="input-field" placeholder="VD: Hội Chém Gió">
      </div>
      <div class="input-group">
        <label class="input-label">Mật khẩu Phòng (E2EE)</label>
        <input type="password" id="createRoomPass" class="input-field" placeholder="Để trống nếu không đặt mật khẩu">
      </div>
      <div class="input-group">
        <label class="input-label">Biệt danh Admin</label>
        <input type="text" id="createNick" class="input-field" placeholder="Nhập biệt danh..." maxlength="20">
      </div>
      <button class="btn-submit" id="btnCreateRoom">Tạo Phòng & Về Chat</button>
    </div>

    <div class="input-group" style="margin-top: 16px;">
      <label class="input-label">Chọn Avatar</label>
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>

    <div class="error-msg" id="loginError">Lỗi thông tin nhập vào!</div>
  </div>

  <!-- 2. GIAO DIỆN CHAT -->
  <div class="chat-app" id="chatApp">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2 style="font-size: 1.1rem; color: white;" id="displayRoomName">AuraChat</h2>
        <button id="btnAdminGear" style="display:none; background:none; border:none; cursor:pointer; font-size:1.2rem;" title="Cài đặt Admin">⚙️</button>
      </div>

      <div class="user-profile">
        <div class="avatar av-g1" id="myAvatar">U</div>
        <div class="user-info">
          <div class="user-name" id="myUsername">User</div>
          <div style="font-size:0.7rem; color: var(--status-online)">● Đang trực tuyến</div>
        </div>
        <button id="btnLogout" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">🚪</button>
      </div>

      <div class="sidebar-content">
        <div class="section-title">Kênh Chung</div>
        <div class="list-item active" id="roomGeneral">
          <div class="avatar av-g3" style="width:32px; height:32px;">#</div>
          <div style="font-weight: 500; font-size:0.9rem;">Phòng Chung</div>
        </div>

        <div class="section-title">Thành viên phòng</div>
        <div id="userList"></div>
      </div>
    </div>

    <div class="chat-window">
      <div class="chat-header">
        <div>
          <h3 id="chatTargetName" style="font-size: 1rem;">Phòng Chung</h3>
          <span id="chatTargetStatus" style="font-size: 0.75rem; color: var(--text-muted)">0 người trực tuyến</span>
        </div>
        <div id="roomCodeDisplay" style="font-size: 0.8rem; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 8px;">Mã phòng: -</div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="chat-input-area">
        <div class="input-wrapper">
          <input type="text" id="messageInput" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
          <button class="btn-submit" id="btnSend" style="width: 80px;">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ADMIN SYSTEM -->
  <div class="modal-overlay" id="modalOverlay"></div>

  <!-- Admin Control Room Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-title">Quản Lý Phòng (Admin)</div>
    <div class="input-group">
      <label class="input-label">Tên Phòng</label>
      <input type="text" id="adminRoomName" class="input-field">
    </div>
    <div class="input-group">
      <label class="input-label">Mật Khẩu Phòng (E2EE)</label>
      <input type="password" id="adminRoomPass" class="input-field">
    </div>
    <div class="input-group" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="adminGeneralMute">
      <label for="adminGeneralMute" style="font-size:0.85rem; color:white;">Khóa Chat Toàn Phòng (Mute All)</label>
    </div>
    <button class="modal-btn btn-submit" id="btnSaveAdmin">Lưu Thay Đổi</button>
    <button class="modal-btn btn-secondary" onclick="closeModals()">Đóng</button>
  </div>

  <!-- Admin Control User Modal -->
  <div class="modal" id="userControlModal">
    <div class="modal-title" id="targetModalUser">Quản Lý Thành Viên</div>
    <button class="modal-btn btn-danger" id="btnKick">Kick Ra Khỏi Phòng</button>
    <button class="modal-btn btn-warning" id="btnMute10">Cấm Chat 10 Phút</button>
    <button class="modal-btn btn-warning" id="btnMutePerm">Cấm Chat Vĩnh Viễn</button>
    <button class="modal-btn btn-submit" id="btnUnmute">Bỏ Cấm Chat</button>
    <button class="modal-btn btn-secondary" id="btnWhitelist" style="background:#3b82f6;">Cho Phép Chat Khi Khóa Phòng</button>
    <button class="modal-btn btn-secondary" onclick="closeModals()">Đóng</button>
  </div>

  <script>
    // --- KHỞI TẠO STATE & VARIABLE ---
    const avatars = ['av-g1', 'av-g2', 'av-g3', 'av-g4', 'av-g5'];
    let selectedAvatar = avatars[0];
    let currentUser = null;
    let adminPrivateKey = null;
    let bc = null;
    let targetUserAction = null;

    let roomState = {
      roomId: '',
      roomName: '',
      roomPassword: '',
      creator: '',
      creatorPublicKey: null,
      mutedUsers: {},
      whitelistedUsers: {},
      generalMute: false,
      timestamp: 0,
      signature: ''
    };

    // --- DOM REFERENCES ---
    const welcomeScreen = document.getElementById('welcomeScreen');
    const chatApp = document.getElementById('chatApp');
    const loginError = document.getElementById('loginError');
    const modalOverlay = document.getElementById('modalOverlay');

    // --- INITIALIZATION ---
    function initAvatars() {
      const grid = document.getElementById('avatarGrid');
      grid.innerHTML = '';
      avatars.forEach((a, index) => {
        const div = document.createElement('div');
        div.className = `avatar ${a} ${index === 0 ? 'selected' : ''}`;
        div.innerText = 'A';
        div.onclick = () => {
          document.querySelectorAll('.avatar-grid .avatar').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          selectedAvatar = a;
        };
        grid.appendChild(div);
      });
    }
    initAvatars();

    // Tab Toggle
    document.getElementById('tabJoin').onclick = () => {
      document.getElementById('tabJoin').classList.add('active');
      document.getElementById('tabCreate').classList.remove('active');
      document.getElementById('panelJoin').style.display = 'block';
      document.getElementById('panelCreate').style.display = 'none';
    };
    document.getElementById('tabCreate').onclick = () => {
      document.getElementById('tabCreate').classList.add('active');
      document.getElementById('tabJoin').classList.remove('active');
      document.getElementById('panelCreate').style.display = 'block';
      document.getElementById('panelJoin').style.display = 'none';
    };

    // Auto load last nickname
    const savedNick = localStorage.getItem('aurachat_last_nick') || '';
    document.getElementById('joinNick').value = savedNick;
    document.getElementById('createNick').value = savedNick;

    // --- WEB CRYPTO & E2EE HELPERS ---
    async function generateAdminKeyPair() {
      return await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
    }

    async function exportKeyJWK(key) { return await crypto.subtle.exportKey("jwk", key); }
    async function importPublicKeyJWK(jwk) {
      return await crypto.subtle.importKey("jwk", jwk, { name: "ECDSA", namedCurve: "P-256" }, true, ["verify"]);
    }

    async function signData(privateKey, data) {
      const encoded = new TextEncoder().encode(data);
      const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, privateKey, encoded);
      return btoa(String.fromCharCode(...new Uint8Array(sig)));
    }

    async function verifyData(publicKeyJWK, data, sigBase64) {
      try {
        const pubKey = await importPublicKeyJWK(publicKeyJWK);
        const encoded = new TextEncoder().encode(data);
        const sigBytes = Uint8Array.from(atob(sigBase64), c => c.charCodeAt(0));
        return await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, pubKey, sigBytes, encoded);
      } catch { return false; }
    }

    function getRoomStateString(state) {
      return `${state.roomId}|${state.roomName}|${state.creator}|${JSON.stringify(state.creatorPublicKey)}|${JSON.stringify(state.mutedUsers)}|${state.generalMute}|${JSON.stringify(state.whitelistedUsers || {})}|${state.timestamp}`;
    }

    async function deriveKey(password, roomId) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode(roomId), iterations: 100000, hash: "SHA-256" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
      );
    }

    async function encryptMessage(text, password, roomId) {
      if (!password) return { cipher: btoa(unescape(encodeURIComponent(text))), iv: '' };
      const key = await deriveKey(password, roomId);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const cipherBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      return {
        cipher: btoa(String.fromCharCode(...new Uint8Array(cipherBuf))),
        iv: btoa(String.fromCharCode(...iv))
      };
    }

    async function decryptMessage(cipher, iv, password, roomId) {
      if (!password || !iv) {
        try { return decodeURIComponent(escape(atob(cipher))); } catch { return cipher; }
      }
      try {
        const key = await deriveKey(password, roomId);
        const ivBytes = Uint8Array.from(atob(iv), c => c.charCodeAt(0));
        const cipherBytes = Uint8Array.from(atob(cipher), c => c.charCodeAt(0));
        const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBytes }, key, cipherBytes);
        return new TextDecoder().decode(plainBuf);
      } catch { return "[Không thể giải mã - Mật khẩu sai]"; }
    }

    // --- CORE ROOM LOGIC ---
    function isAdmin() {
      return currentUser && roomState.creator === currentUser.nickname && adminPrivateKey !== null;
    }

    function processNickname(inputNick) {
      const last = localStorage.getItem('aurachat_last_nick');
      let finalNick = inputNick;
      if (last && last !== inputNick) {
        finalNick = `${inputNick} (lúc trước là: ${last})`;
      }
      localStorage.setItem('aurachat_last_nick', inputNick);
      return finalNick;
    }

    // Sửa lỗi treo nút "Bắt đầu chat" bằng try-catch & async handling chuẩn
    document.getElementById('btnCreateRoom').onclick = async () => {
      const btn = document.getElementById('btnCreateRoom');
      try {
        btn.disabled = true;
        const rawNick = document.getElementById('createNick').value.trim();
        const rName = document.getElementById('createRoomName').value.trim();
        const rPass = document.getElementById('createRoomPass').value.trim();

        if (!rawNick || !rName) return showError("Vui lòng nhập đầy đủ thông tin!");

        const nick = processNickname(rawNick);
        const roomId = 'ROOM_' + Math.random().toString(36).substr(2, 6).toUpperCase();

        const keyPair = await generateAdminKeyPair();
        adminPrivateKey = keyPair.privateKey;
        const pubKeyJWK = await exportKeyJWK(keyPair.publicKey);

        // Export Priv Key local storage for session recovery
        const privJWK = await exportKeyJWK(adminPrivateKey);
        localStorage.setItem(`aurachat_priv_${roomId}`, JSON.stringify(privJWK));

        roomState = {
          roomId, roomName: rName, roomPassword: rPass, creator: nick,
          creatorPublicKey: pubKeyJWK, mutedUsers: {}, whitelistedUsers: {},
          generalMute: false, timestamp: Date.now(), signature: ''
        };

        roomState.signature = await signData(adminPrivateKey, getRoomStateString(roomState));
        localStorage.setItem(`aurachat_state_${roomId}`, JSON.stringify(roomState));

        await enterRoom(nick, roomId, rPass);
      } catch (err) {
        showError("Lỗi khởi tạo phòng: " + err.message);
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById('btnJoinRoom').onclick = async () => {
      const btn = document.getElementById('btnJoinRoom');
      try {
        btn.disabled = true;
        const rawNick = document.getElementById('joinNick').value.trim();
        const roomId = document.getElementById('joinRoomId').value.trim().toUpperCase();
        const rPass = document.getElementById('joinRoomPass').value.trim();

        if (!rawNick || !roomId) return showError("Vui lòng nhập Biệt danh và Mã phòng!");

        const savedStateStr = localStorage.getItem(`aurachat_state_${roomId}`);
        if (!savedStateStr) return showError("Phòng không tồn tại!");

        const incomingState = JSON.parse(savedStateStr);
        const isValid = await verifyData(incomingState.creatorPublicKey, getRoomStateString(incomingState), incomingState.signature);
        if (!isValid) return showError("Cảnh báo: Trạng thái phòng không hợp lệ hoặc bị giả mạo!");

        if (incomingState.roomPassword && incomingState.roomPassword !== rPass) {
          return showError("Mật khẩu phòng không chính xác!");
        }

        const nick = processNickname(rawNick);
        roomState = incomingState;
        roomState.roomPassword = rPass;

        // Try load Admin key if creator
        const privJWKStr = localStorage.getItem(`aurachat_priv_${roomId}`);
        if (privJWKStr && incomingState.creator === nick) {
          adminPrivateKey = await crypto.subtle.importKey("jwk", JSON.parse(privJWKStr), { name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]);
        }

        await enterRoom(nick, roomId, rPass);
      } catch (err) {
        showError("Lỗi tham gia phòng: " + err.message);
      } finally {
        btn.disabled = false;
      }
    };

    function showError(msg) {
      loginError.innerText = msg;
      loginError.style.display = 'block';
    }

    async function enterRoom(nick, roomId, pass) {
      currentUser = { nickname: nick, avatar: selectedAvatar };
      welcomeScreen.style.display = 'none';
      chatApp.style.display = 'grid';

      document.getElementById('myAvatar').className = `avatar ${selectedAvatar}`;
      document.getElementById('myAvatar').innerText = nick.charAt(0).toUpperCase();
      document.getElementById('myUsername').innerText = nick;
      document.getElementById('displayRoomName').innerText = roomState.roomName;
      document.getElementById('roomCodeDisplay').innerText = `Mã phòng: ${roomState.roomId}`;

      if (isAdmin()) document.getElementById('btnAdminGear').style.display = 'block';

      // Setup BroadcastChannel
      if (bc) bc.close();
      bc = new BroadcastChannel(`aurachat_${roomId}`);
      bc.onmessage = handleBroadcastMessage;

      // Register Presence
      sendPresencePing();
      setInterval(sendPresencePing, 3000);

      appendSystemMessage(`${nick} đã tham gia phòng.`);
      bc.postMessage({ type: 'sys_join', nickname: nick });

      updateUI();
    }

    // --- REALTIME CHAT & MESSAGING ---
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      // Check Mute
      if (isMuted(currentUser.nickname)) {
        appendSystemMessage("Bạn đang bị cấm nhắn tin!");
        return;
      }
      if (roomState.generalMute && !isAdmin() && !roomState.whitelistedUsers[currentUser.nickname]) {
        appendSystemMessage("Phòng đang bị khóa chat bởi Admin!");
        return;
      }

      const { cipher, iv } = await encryptMessage(text, roomState.roomPassword, roomState.roomId);
      const msg = {
        id: 'msg_' + Date.now(),
        sender: currentUser.nickname,
        avatar: currentUser.avatar,
        cipher, iv, timestamp: Date.now()
      };

      saveMessage(msg);
      bc.postMessage({ type: 'new_msg', msg });
      appendMessageUI(currentUser.nickname, currentUser.avatar, text, true, msg.timestamp);
      input.value = '';
    }

    document.getElementById('btnSend').onclick = sendMessage;
    document.getElementById('messageInput').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

    function saveMessage(msg) {
      const msgs = JSON.parse(localStorage.getItem(`aurachat_msgs_${roomState.roomId}`) || '[]');
      msgs.push(msg);
      localStorage.setItem(`aurachat_msgs_${roomState.roomId}`, JSON.stringify(msgs));
    }

    async function renderAllMessages() {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      const msgs = JSON.parse(localStorage.getItem(`aurachat_msgs_${roomState.roomId}`) || '[]');
      for (const m of msgs) {
        const plainText = await decryptMessage(m.cipher, m.iv, roomState.roomPassword, roomState.roomId);
        appendMessageUI(m.sender, m.avatar, plainText, m.sender === currentUser.nickname, m.timestamp);
      }
    }

    function appendMessageUI(sender, avatar, text, isMe, timestamp) {
      const container = document.getElementById('messagesContainer');
      const group = document.createElement('div');
      group.className = `msg-group ${isMe ? 'me' : 'other'}`;

      const timeStr = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      group.innerHTML = `
        <div class="avatar ${avatar}">${sender.charAt(0).toUpperCase()}</div>
        <div>
          ${!isMe ? `<div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:2px;">${sender}</div>` : ''}
          <div class="msg-bubble">${text}</div>
          <div style="font-size:0.65rem; color:var(--text-muted); text-align:${isMe?'right':'left'}; margin-top:2px;">${timeStr}</div>
        </div>
      `;
      container.appendChild(group);
      container.scrollTop = container.scrollHeight;
    }

    function appendSystemMessage(text) {
      const container = document.getElementById('messagesContainer');
      const div = document.createElement('div');
      div.className = 'system-message';
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // --- BROADCAST & PRESENCE HANDLER ---
    function sendPresencePing() {
      if (!currentUser) return;
      const sessions = JSON.parse(localStorage.getItem(`aurachat_sess_${roomState.roomId}`) || '{}');
      sessions[currentUser.nickname] = { avatar: currentUser.avatar, lastActive: Date.now() };
      localStorage.setItem(`aurachat_sess_${roomState.roomId}`, JSON.stringify(sessions));
      updateUserList();
    }

    async function handleBroadcastMessage(e) {
      const data = e.data;
      if (!data) return;

      if (data.type === 'new_msg') {
        const plainText = await decryptMessage(data.msg.cipher, data.msg.iv, roomState.roomPassword, roomState.roomId);
        appendMessageUI(data.msg.sender, data.msg.avatar, plainText, false, data.msg.timestamp);
      } else if (data.type === 'sys_join') {
        appendSystemMessage(`${data.nickname} đã vào phòng.`);
        updateUserList();
      } else if (data.type === 'state_update') {
        roomState = data.roomState;
        updateUI();
      } else if (data.type === 'kick' && data.target === currentUser.nickname) {
        alert("Bạn đã bị Admin đá ra khỏi phòng!");
        location.reload();
      }
    }

    function updateUserList() {
      const sessions = JSON.parse(localStorage.getItem(`aurachat_sess_${roomState.roomId}`) || '{}');
      const list = document.getElementById('userList');
      list.innerHTML = '';
      const now = Date.now();
      let count = 0;

      for (const [nick, info] of Object.entries(sessions)) {
        if (now - info.lastActive < 8000) {
          count++;
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="avatar ${info.avatar}">${nick.charAt(0).toUpperCase()}</div>
            <div style="flex:1; font-size:0.85rem; color:white;">${nick} ${nick === roomState.creator ? '👑' : ''}</div>
            ${isAdmin() && nick !== currentUser.nickname ? `<button onclick="openUserControl('${nick}')" style="background:none; border:none; cursor:pointer;">⚙️</button>` : ''}
          `;
          list.appendChild(item);
        }
      }
      document.getElementById('chatTargetStatus').innerText = `${count} người trực tuyến`;
    }

    function isMuted(nick) {
      const exp = roomState.mutedUsers[nick];
      if (!exp) return false;
      if (exp === -1 || exp > Date.now()) return true;
      return false;
    }

    function updateUI() {
      document.getElementById('displayRoomName').innerText = roomState.roomName;
      renderAllMessages();

      // Check input disabled state
      const input = document.getElementById('messageInput');
      if (isMuted(currentUser.nickname)) {
        input.disabled = true;
        input.placeholder = "Bạn đang bị cấm chat...";
      } else if (roomState.generalMute && !isAdmin() && !roomState.whitelistedUsers[currentUser.nickname]) {
        input.disabled = true;
        input.placeholder = "Phòng đang bị khóa chat...";
      } else {
        input.disabled = false;
        input.placeholder = "Nhập tin nhắn...";
      }
    }

    // --- ADMIN MODAL CONTROLS ---
    document.getElementById('btnAdminGear').onclick = () => {
      document.getElementById('adminRoomName').value = roomState.roomName;
      document.getElementById('adminRoomPass').value = roomState.roomPassword;
      document.getElementById('adminGeneralMute').checked = roomState.generalMute;
      modalOverlay.style.display = 'block';
      document.getElementById('adminModal').style.display = 'block';
    };

    document.getElementById('btnSaveAdmin').onclick = async () => {
      if (!isAdmin()) return;
      roomState.roomName = document.getElementById('adminRoomName').value.trim();
      roomState.roomPassword = document.getElementById('adminRoomPass').value.trim();
      roomState.generalMute = document.getElementById('adminGeneralMute').checked;
      roomState.timestamp = Date.now();
      roomState.signature = await signData(adminPrivateKey, getRoomStateString(roomState));

      localStorage.setItem(`aurachat_state_${roomState.roomId}`, JSON.stringify(roomState));
      bc.postMessage({ type: 'state_update', roomState });
      closeModals();
      updateUI();
      appendSystemMessage("Admin đã cập nhật cấu hình phòng.");
    };

    window.openUserControl = (nick) => {
      targetUserAction = nick;
      document.getElementById('targetModalUser').innerText = `Quản Lý: ${nick}`;
      modalOverlay.style.display = 'block';
      document.getElementById('userControlModal').style.display = 'block';
    };

    function closeModals() {
      modalOverlay.style.display = 'none';
      document.getElementById('adminModal').style.display = 'none';
      document.getElementById('userControlModal').style.display = 'none';
    }

    document.getElementById('btnKick').onclick = () => {
      if (!isAdmin()) return;
      bc.postMessage({ type: 'kick', target: targetUserAction });
      appendSystemMessage(`Admin đã kick ${targetUserAction} ra khỏi phòng.`);
      closeModals();
    };

    document.getElementById('btnMute10').onclick = async () => {
      if (!isAdmin()) return;
      roomState.mutedUsers[targetUserAction] = Date.now() + 10 * 60 * 1000;
      await syncStateAndNotify(`Đã cấm chat ${targetUserAction} trong 10 phút.`);
    };

    document.getElementById('btnMutePerm').onclick = async () => {
      if (!isAdmin()) return;
      roomState.mutedUsers[targetUserAction] = -1;
      await syncStateAndNotify(`Đã cấm chat ${targetUserAction} vĩnh viễn.`);
    };

    document.getElementById('btnUnmute').onclick = async () => {
      if (!isAdmin()) return;
      delete roomState.mutedUsers[targetUserAction];
      await syncStateAndNotify(`Đã bỏ cấm chat cho ${targetUserAction}.`);
    };

    document.getElementById('btnWhitelist').onclick = async () => {
      if (!isAdmin()) return;
      roomState.whitelistedUsers[targetUserAction] = !roomState.whitelistedUsers[targetUserAction];
      const status = roomState.whitelistedUsers[targetUserAction] ? 'được đặc cách' : 'bỏ đặc cách';
      await syncStateAndNotify(`${targetUserAction} đã ${status} nhắn tin khi khóa phòng.`);
    };

    async function syncStateAndNotify(msg) {
      roomState.timestamp = Date.now();
      roomState.signature = await signData(adminPrivateKey, getRoomStateString(roomState));
      localStorage.setItem(`aurachat_state_${roomState.roomId}`, JSON.stringify(roomState));
      bc.postMessage({ type: 'state_update', roomState });
      closeModals();
      updateUI();
      appendSystemMessage(msg);
    }

    document.getElementById('btnLogout').onclick = () => location.reload();
  </script>
</body>
